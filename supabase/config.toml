# Minimal Supabase CLI config for local development.
# See https://supabase.com/docs/guides/cli/config

project_id = "cucocare"

[api]
enabled = true

[db]
port = 54322
major_version = 15

[auth]
enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = false

# Called while signed out (sign-up and password reset).
[functions.email-otp]
verify_jwt = false
