org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Disable Kotlin incremental compilation to avoid Windows file-lock errors
kotlin.incremental=false
# Gradle needs a full JDK 17. Set it per machine, not here:
#   flutter config --jdk-dir=<path to JDK 17>
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9+ built-in Kotlin (flutter_timezone & workmanager_android support this path).
android.builtInKotlin=true
