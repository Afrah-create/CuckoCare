org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Gradle must run on a full JDK 17 (JRE-only Java 25 breaks plugin compiles). Override on macOS/Windows if needed.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9+ built-in Kotlin (flutter_timezone & workmanager_android support this path).
android.builtInKotlin=true
